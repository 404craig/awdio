[project]
name = "awdio"
version = "0.1.0"
description = "Self-hosted listen-to-your-documents server: parsing, structure analysis and TTS with word timings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "kokoro>=0.9.4",
    "torch>=2.3",
    "en-core-web-sm",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx: FastAPI TestClient

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awdio"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "I"]
ignore = ["B008"]  # FastAPI's Depends() in parameter defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/corpus.py" = ["E501"]  # long public-domain prose passages
